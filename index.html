<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>student registeration form</title>
</head>
<body>
	<h1>student registeration form</h1>
	<p> fileds marked with * are required</p>
<form action="submit.php" method="post" enctype="multipart/form-data">
	<fieldset>
		<legend> personal information</legend>
		<p>
<label for="name">Full Name *</label><br>
<input type="text" id="name" name="name"
placeholder="eg.Homaj Joshi"
required minlength="3" autocomplete="name">
</p>
<p>
<label for="email">Email *</label><br>
<input type="email" id="email" name="email"
placeholder="eg.hfgjj423@gmail.com"
required autocomplete="email">
</p>
<p>
<label for="age">Age</label><br>
<input type="number" id="age" name="age"
min="15" max="60" placeholder="e.g. 20">
</p>
<p>
<label for="dob">Date of Birth</label><br>
<input type="date" id="dob" name="dob">
</p>
<p>
Gender *<br>
<input type="radio" id="male" name="gender" value="male" required>
<label for="male">Male</label>
<input type="radio" id="female" name="gender" value="female" checked>
<label for="female">Female</label>
<input type="radio" id="other" name="gender" value="other">
<label for="other">Other</label>
</p>
</fieldset>
<br>
<fieldset>
	<legend> EDUCATION  AND SKLLLS</legend>
	<p>
	<label for="course"> course * </label><br>	
<select id="course" name="course" required>
<option value="" disabled selected>-- Select a course --</option>
<option value="cs">Computer Science</option>
<option value="it">IT</option>
<option value="electronics">Electronics</option>
</select>
</p>
<p>
skills <br>
<input type="checkbox" id="html" name="skills" value="html">
<label for="html"> Html</label>
<input type="checkbox" id="css" name="skills" value="css">
<label for="css"> css</label>
<input type="checkbox" id="js" name="skills" value="javascript">
<label for="js"> javascript</label>
</p>
<p>
	<label for="resume"> upload resume(pdf only)</label><br>
	<input type="file" id="resume" name="resume" accept=".pdf"></p>
</fieldset>
<br>
<fieldset>
<legend>ADRESS</legend>	
<p>
<label for="address">Full Address</label><br>
<textarea id="address" name="address" rows="4" cols="40"
maxlength="200"
placeholder="House no., street, city"></textarea>

</p>
</fieldset>
<br>
<fieldset>
<legend>Login Details</legend>
<p>
<label for="username">Username *</label><br>
<input type="text" id="username" name="username"
required pattern="[A-Za-z0-9_]{4,15}"
title="4 to 15 letters, numbers or underscore"
autocomplete="username">
</p>
<p>
<label for="password">Password *</label><br>
<input type="password" id="password" name="password"
required minlength="8" autocomplete="new-password"
placeholder="At least 8 characters">
</p>
</fieldset>
<br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
<button type="button" onclick="alert('bro what this this website')">
	click me </button>
</form>
</body>
</html>
